<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Lone Wizard</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }

    #error-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      color: red;
      font-family: monospace;
      font-size: 24px;
      white-space: pre-wrap;
      padding: 20px;
    }
  </style>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      const container = document.getElementById('error-container') || document.createElement('div');
      container.id = 'error-container';
      document.body.appendChild(container);
      container.innerText += `ERROR: ${message}\nAt: ${source}:${lineno}:${colno}\n\n`;
      console.error(error);
    };
    window.addEventListener('unhandledrejection', function (event) {
      const container = document.getElementById('error-container') || document.createElement('div');
      container.id = 'error-container';
      document.body.appendChild(container);
      container.innerText += `PROMISE ERROR: ${event.reason}\n\n`;
      console.error(event.reason);
    });
  </script>
</head>

<body>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
